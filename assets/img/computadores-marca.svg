<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Marca de la asignatura Computadores">
  <!-- patillas del chip: diag-bus #6b5f55 -->
  <g fill="#6b5f55">
    <rect x="18" y="2" width="4" height="8" rx="1"/><rect x="30" y="2" width="4" height="8" rx="1"/><rect x="42" y="2" width="4" height="8" rx="1"/>
    <rect x="18" y="54" width="4" height="8" rx="1"/><rect x="30" y="54" width="4" height="8" rx="1"/><rect x="42" y="54" width="4" height="8" rx="1"/>
    <rect x="2" y="18" width="8" height="4" rx="1"/><rect x="2" y="30" width="8" height="4" rx="1"/><rect x="2" y="42" width="8" height="4" rx="1"/>
    <rect x="54" y="18" width="8" height="4" rx="1"/><rect x="54" y="30" width="8" height="4" rx="1"/><rect x="54" y="42" width="8" height="4" rx="1"/>
  </g>
  <!-- cuerpo: vitor #a8192b, radius-md -->
  <rect x="8" y="8" width="48" height="48" rx="12" fill="#a8192b"/>
